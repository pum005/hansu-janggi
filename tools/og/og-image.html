<!doctype html>
<!-- 공유 미리보기 그림(site/og-image.png, 1200x630) 원본.
     다시 만들기: tools/og/render.sh -->
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: #f5f4f0; font-family: "Pretendard Variable", Pretendard, sans-serif; color: #1d1d1f;
         display: grid; grid-template-columns: 1fr 520px; align-items: center; padding: 0 64px 0 80px; gap: 40px; letter-spacing: -0.02em; }
  .brand { display: flex; align-items: center; gap: 16px; font-weight: 800; font-size: 34px; }
  .mark { width: 56px; height: 56px; display: grid; place-items: center; background: #1d1d1f; color: #fff;
          font-family: "Noto Serif KR", serif; font-weight: 900; font-size: 30px;
          clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%); }
  h1 { font-size: 62px; line-height: 1.18; font-weight: 800; margin: 36px 0 22px; letter-spacing: -0.035em; }
  h1 em { font-style: normal; color: #17734f; }
  p { font-size: 26px; color: #5c5c61; line-height: 1.5; }
  .tags { display: flex; gap: 10px; margin-top: 30px; }
  .tags span { font-size: 21px; font-weight: 700; padding: 9px 18px; border-radius: 999px; background: #fff; border: 1px solid #e6e3dc; }
  .board { width: 520px; height: 574px; border-radius: 22px; overflow: hidden; box-shadow: 0 18px 50px rgba(60,40,10,.18);
           background: url("../../docs/screenshots/desktop.png") no-repeat; background-size: 1206px 754px; background-position: -180px -107px; }
</style></head>
<body>
  <div>
    <div class="brand"><span class="mark">將</span>한수 장기</div>
    <h1>설치 없이 바로 두는<br><em>장기 AI 대국</em></h1>
    <p>회원가입 없이 브라우저에서 바로, 무료로</p>
    <div class="tags"><span>실력 4단계</span><span>훈수 · 무르기</span><span>복기 분석</span></div>
  </div>
  <div class="board" role="img" aria-label="장기판"></div>
</body></html>
