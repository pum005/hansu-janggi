<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="style.css">
<style>
body{width:390px}
header{height:56px;padding:0 18px}
.menu{width:22px;display:flex;flex-direction:column;gap:5px}.menu i{height:2px;background:var(--ink);border-radius:2px}
.wrap{padding:12px 12px 20px;display:flex;flex-direction:column;gap:12px}
.pbar{display:flex;align-items:center;justify-content:space-between;padding:0 4px}
.btn{height:46px;font-size:13.5px}
.card{padding:16px}
footer{flex-direction:column;gap:8px;padding:18px;text-align:center}footer span a{margin:0 9px}
</style></head><body>
<header><div class="logo"><i>將</i>한수 장기</div><div class="menu"><i></i><i></i><i></i></div></header>
<div class="wrap">
  <div class="seg"><span>입문</span><span>중수</span><span class="on">고수</span><span>최강</span></div>
  <div class="pbar">
    <div class="player"><span class="chip" style="color:var(--han);border-color:var(--han)">漢</span>AI · 고수</div>
    <div class="muted" style="color:var(--cho);font-weight:700">초 +1.4</div>
  </div>
  <div class="eval"><b></b></div>
  <div id="board"></div>
  <div class="pbar">
    <div class="player"><span class="chip" style="color:var(--cho);border-color:var(--cho)">楚</span>나 <span class="status" style="margin-left:4px"><span class="dot"></span><span class="muted">내 차례</span></span></div>
    <div class="muted">상마상마</div>
  </div>
  <div class="row"><div class="btn hint">훈수</div><div class="btn">무르기</div><div class="btn">한수 쉼</div><div class="btn pri">새 대국</div></div>
  <div class="card">
    <div class="label">수순</div>
    <div class="moves">
      <div class="n">1</div><div>卒 27→37</div><div>兵 73→63</div>
      <div class="n">2</div><div>馬 89→77</div><div>兵 74→64</div>
      <div class="n">3</div><div>卒 37→36</div><div class="last">兵 63→53</div>
    </div>
  </div>
  <div class="ad" style="height:110px;margin-top:8px"><span>광고 영역</span><small>320 × 100 · 판에서 충분히 떨어진 곳</small></div>
</div>
<footer><span><a>개인정보처리방침</a><a>소스 공개</a></span><span>© 2026 한수 장기 · Fairy-Stockfish (GPL-3.0)</span></footer>
<script src="board.js"></script><script>drawBoard(document.getElementById('board'),39.4)</script>
</body></html>
